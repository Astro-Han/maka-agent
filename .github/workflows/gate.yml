name: CI suite probe
on:
  pull_request:
    branches: [test/ci-gate-base]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
concurrency:
  group: probe-${{ github.ref }}-${{ github.event.action == 'edited' && github.event.changes.base.ref.from == '' && github.run_id || 'test' }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate merge parents
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
          git log -1 --format='%H %P'
      - name: Bounded scheduler fixture
        run: sleep 40
