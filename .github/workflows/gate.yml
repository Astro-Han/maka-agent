name: CI suite probe
on:
  workflow_dispatch:
  pull_request:
    branches: [test/ci-gate-base]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
concurrency:
  group: probe-${{ github.ref }}-${{ github.event.action == 'edited' && github.event.changes.base.ref.from == '' && github.run_id || 'test' }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ github.event.action == 'edited' && github.event.changes.base.ref.from == '' && 'ignored-edit' || 'test' }}
    if: github.event.action != 'edited' || github.event.changes.base.ref.from != ''
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'real fixture validation'
